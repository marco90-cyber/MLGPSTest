name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      # Se hai aggiunto i Secrets, l'APK viene firmato con la tua chiave
      # (così gli aggiornamenti si installano sopra la versione precedente).
      - name: Prepara la chiave di firma
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Chiave di firma trovata"
          else
            echo "Nessuna chiave nei Secrets: uso la chiave di debug"
          fi

      - name: Compila l'APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Rinomina l'APK
        run: cp app/build/outputs/apk/release/app-release.apk MLGPSTest.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MLGPSTest
          path: MLGPSTest.apk

      # Ogni build diventa una Release; l'ultima è sempre quella segnata come "Latest".
      - name: Pubblica la Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" MLGPSTest.apk \
            --title "MLGPSTest $TAG" \
            --notes "Build automatica del commit ${GITHUB_SHA::7}" \
            --latest
